name: BingX Trend Pullback Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: bingx-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    # Pinned: ubuntu-latest is migrating to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      # Reuse installed packages between runs instead of reinstalling every cycle.
      - uses: actions/cache@v4
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.ImageOS }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies (only when cache missed)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Put venv on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run one bot cycle
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          # Strategy settings (daily 55-day Donchian breakout, 20-day channel /
          # 2 ATR trailing stop, no trend or momentum filter) are the code
          # defaults in config.py -- the rule that was backtested. The old
          # 4h-strategy repo Variables are deliberately no longer passed in.
          # Risk per trade: 2% of equity (chosen 2026-11-09). Edit here to change.
          RISK_PCT_PER_TRADE: "2"
          MARGIN_PER_TRADE_USDT: ${{ vars.MARGIN_PER_TRADE_USDT }}
          MAX_MARGIN_UTILIZATION_PCT: ${{ vars.MAX_MARGIN_UTILIZATION_PCT }}
          MAX_DAILY_LOSS_PCT: ${{ vars.MAX_DAILY_LOSS_PCT }}
          MAX_CONCURRENT_POSITIONS: ${{ vars.MAX_CONCURRENT_POSITIONS }}
          MIN_NOTIONAL_USDT: ${{ vars.MIN_NOTIONAL_USDT }}
          DRY_RUN_FEE_PCT_PER_SIDE: ${{ vars.DRY_RUN_FEE_PCT_PER_SIDE }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python3 bot.py

      - name: Persist bot state and trade journal back to the repo
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/ 2>/dev/null)" ]; then
            git config user.name "bingx-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/
            git commit -m "chore: update bot state and trade journal"
            git pull --rebase origin main
            git push
          else
            echo "No state/journal changes to commit."
          fi
